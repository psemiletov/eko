name: Windows Build with Installer

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_installer:
        description: 'Создать инсталлятор Inno Setup'
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Find and setup Qt
        run: |
          # Ищем Qt в стандартных местах на GitHub Actions
          $qtPaths = @()

          # Проверяем C:\Qt (обычно тут устанавливается Qt)
          if (Test-Path "C:\Qt") {
            $qtPaths += Get-ChildItem -Path "C:\Qt" -Directory | Where-Object {
              (Test-Path "$($_.FullName)\msvc2019_64\bin\qmake.exe") -or
              (Test-Path "$($_.FullName)\msvc2022_64\bin\qmake.exe")
            }
          }

          # Проверяем C:\hostedtoolcache\windows\Qt
          if (Test-Path "C:\hostedtoolcache\windows\Qt") {
            $qtPaths += Get-ChildItem -Path "C:\hostedtoolcache\windows\Qt" -Directory | Where-Object {
              (Test-Path "$($_.FullName)\msvc2019_64\bin\qmake.exe") -or
              (Test-Path "$($_.FullName)\msvc2022_64\bin\qmake.exe")
            }
          }

          if ($qtPaths.Count -gt 0) {
            # Сортируем по версии и берём самую новую
            $qtPath = $qtPaths | Sort-Object Name -Descending | Select-Object -First 1

            # Определяем архитектуру
            if (Test-Path "$($qtPath.FullName)\msvc2022_64\bin\qmake.exe") {
              $qtArch = "msvc2022_64"
            } elseif (Test-Path "$($qtPath.FullName)\msvc2019_64\bin\qmake.exe") {
              $qtArch = "msvc2019_64"
            } else {
              Write-Host "ERROR: No valid Qt architecture found!"
              exit 1
            }

            $qtFullPath = "$($qtPath.FullName)\$qtArch"
            Write-Host "Found Qt at: $qtFullPath"

            # Устанавливаем переменные для CMake
            $qtCMakePath = "$qtFullPath\lib\cmake\Qt6"
            if (Test-Path $qtCMakePath) {
              echo "Qt6_DIR=$qtCMakePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Qt6_DIR set to: $qtCMakePath"
            } else {
              Write-Host "WARNING: Qt6 CMake config not found at $qtCMakePath"
            }

            # Добавляем bin в PATH
            echo "$qtFullPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "CMAKE_PREFIX_PATH=$qtFullPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            Write-Host "Qt setup completed successfully!"
          } else {
            Write-Host "ERROR: Qt not found!"
            Write-Host "Available directories in C:\Qt:"
            if (Test-Path "C:\Qt") {
              dir C:\Qt
            }
            exit 1
          }

      - name: Add vcpkg to PATH
        run: |
          echo "C:\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install vcpkg dependencies (from vcpkg.json)
        run: |
          vcpkg install --triplet x64-windows

      - name: Configure CMake with MSVC
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'Release' }} `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Build
        run: |
          cmake --build build --config ${{ inputs.build_type || 'Release' }}

      - name: Deploy Qt
        run: |
          windeployqt --release build/eko.exe

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path build\* -DestinationPath eko-win-x64-${{ inputs.build_type || 'Release' }}.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: eko-win-x64-${{ inputs.build_type || 'Release' }}
          path: eko-win-x64-${{ inputs.build_type || 'Release' }}.zip

      - name: Download Inno Setup
        if: ${{ inputs.create_installer == true }}
        run: |
          curl -L -o innosetup.exe https://jrsoftware.org/download.php/is.exe
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Build Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: eko-setup-${{ inputs.build_type || 'Release' }}
          path: eko-setup.exe
