name: Windows Build with Installer

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_installer:
        description: 'Создать инсталлятор Inno Setup'
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Find and setup Qt
        run: |
          # Ищем все установленные Qt версии
          $qtRoot = "C:\Qt"
          $qtPaths = Get-ChildItem -Path $qtRoot -Directory -Recurse -Depth 2 | Where-Object {
            $_.Name -match 'msvc' -and (Test-Path "$($_.FullName)\bin\qmake.exe")
          }

          # Сортируем по версии (выбираем самую новую)
          $qtPaths = $qtPaths | Sort-Object {
            [version]($_.Name -replace 'msvc.*', '' -replace '_.*', '')
          } -Descending

          $qtPath = $qtPaths | Select-Object -First 1

          if ($qtPath) {
            Write-Host "Found Qt at: $($qtPath.FullName)"
            $qtVersion = Split-Path -Path $qtPath.FullName -Parent | Split-Path -Leaf
            Write-Host "Qt Version: $qtVersion"

            # Проверяем наличие CMake конфигов
            $qtCMakePath = "$($qtPath.FullName)\lib\cmake\Qt6"
            if (Test-Path $qtCMakePath) {
              Write-Host "Qt6 CMake config found at: $qtCMakePath"
              echo "Qt6_DIR=$qtCMakePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              Write-Host "WARNING: Qt6 CMake config not found!"
              # Пробуем альтернативный путь
              $qtCMakePath = "$($qtPath.FullName)\lib\cmake\Qt6"
              if (Test-Path $qtCMakePath) {
                echo "Qt6_DIR=$qtCMakePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }

            # Добавляем bin в PATH для windeployqt
            echo "$($qtPath.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            # Устанавливаем CMAKE_PREFIX_PATH
            echo "CMAKE_PREFIX_PATH=$($qtPath.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "ERROR: No Qt installation found!"
            exit 1
          }

      - name: Add vcpkg to PATH
        run: |
          echo "C:\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install vcpkg dependencies (from vcpkg.json)
        run: |
          vcpkg install --triplet x64-windows

      - name: Configure CMake with MSVC
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'Release' }} `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Build
        run: |
          cmake --build build --config ${{ inputs.build_type || 'Release' }}

      - name: Deploy Qt
        run: |
          windeployqt --release build/eko.exe

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path build\* -DestinationPath eko-win-x64-${{ inputs.build_type || 'Release' }}.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: eko-win-x64-${{ inputs.build_type || 'Release' }}
          path: eko-win-x64-${{ inputs.build_type || 'Release' }}.zip

      - name: Download Inno Setup
        if: ${{ inputs.create_installer == true }}
        run: |
          curl -L -o innosetup.exe https://jrsoftware.org/download.php/is.exe
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Build Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: eko-setup-${{ inputs.build_type || 'Release' }}
          path: eko-setup.exe
