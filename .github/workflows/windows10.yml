name: Windows Build with Installer

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_installer:
        description: 'Создать инсталлятор Inno Setup'
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt via Chocolatey
        run: |
          choco install qt6 --version=6.6.3 --force --no-progress
          echo "C:\Qt\6.6.3\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "Qt6_DIR=C:\Qt\6.6.3\msvc2022_64\lib\cmake\Qt6" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CMAKE_PREFIX_PATH=C:\Qt\6.6.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Add vcpkg to PATH
        run: |
          echo "C:\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install vcpkg dependencies
        run: |
          vcpkg install --triplet x64-windows

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'Release' }} `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH=C:/Qt/6.6.3/msvc2022_64

      - name: Build
        run: |
          cmake --build build --config ${{ inputs.build_type || 'Release' }}

      - name: Deploy Qt
        run: |
          windeployqt --release build/eko.exe

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path build\* -DestinationPath eko-win-x64-${{ inputs.build_type || 'Release' }}.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: eko-win-x64-${{ inputs.build_type || 'Release' }}
          path: eko-win-x64-${{ inputs.build_type || 'Release' }}.zip

      - name: Download Inno Setup
        if: ${{ inputs.create_installer == true }}
        run: |
          curl -L -o innosetup.exe https://jrsoftware.org/download.php/is.exe
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Build Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: eko-setup-${{ inputs.build_type || 'Release' }}
          path: eko-setup.exe
