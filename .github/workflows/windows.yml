name: Windows Build (MinGW-w64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_installer:
        description: 'Создать инсталлятор Inno Setup'
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-binutils

      - name: Build with MSYS2
        shell: msys2 {0}
        run: |
          export PATH=/ucrt64/bin:$PATH
          mkdir -p build
          cd build
          cmake .. -G "Ninja" \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'Release' }} \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
          ninja

      - name: Deploy Qt
        shell: msys2 {0}
        run: |
          cd build
          windeployqt --release eko.exe

      - name: Find and copy all dependencies
        shell: msys2 {0}
        run: |
          # Создаём папку для установщика
          mkdir -p installer_files

          # Копируем EXE
          cp build/eko.exe installer_files/

          # Копируем все DLL, которые уже скопировал windeployqt
          cp build/*.dll installer_files/ 2>/dev/null || true

          # === АВТОМАТИЧЕСКОЕ ОПРЕДЕЛЕНИЕ ЗАВИСИМОСТЕЙ ===
          echo "=== Finding dependencies for eko.exe ==="

          # Создаём временный файл для хранения всех DLL
          temp_deps=$(mktemp)

          # Функция для рекурсивного поиска зависимостей
          find_deps() {
            local file="$1"
            if [ ! -f "$file" ]; then
              return
            fi
            # Используем objdump для поиска зависимостей
            objdump -p "$file" | grep "DLL Name" | awk '{print $3}' | while read -r dll; do
              # Проверяем, есть ли такая DLL в MSYS2
              if [ -f "/ucrt64/bin/$dll" ]; then
                echo "$dll" >> "$temp_deps"
                # Рекурсивно проверяем зависимости найденной DLL
                find_deps "/ucrt64/bin/$dll"
              fi
            done
          }

          # Начинаем поиск с eko.exe
          find_deps "build/eko.exe"

          # Копируем все найденные уникальные DLL
          echo "=== Copying found DLLs ==="
          sort -u "$temp_deps" | while read -r dll; do
            if [ -f "/ucrt64/bin/$dll" ]; then
              echo "  Copying: $dll"
              cp "/ucrt64/bin/$dll" installer_files/
            else
              echo "  NOT FOUND: $dll"
            fi
          done

          rm -f "$temp_deps"

          # === Копирование папок с плагинами Qt ===
          cp -r build/platforms installer_files/ 2>/dev/null || true
          cp -r build/styles installer_files/ 2>/dev/null || true
          cp -r build/imageformats installer_files/ 2>/dev/null || true
          cp -r build/iconengines installer_files/ 2>/dev/null || true

          mkdir -p installer_files/platforms
          mkdir -p installer_files/styles
          mkdir -p installer_files/imageformats
          mkdir -p installer_files/iconengines

          # Выводим список скопированных DLL
          echo "=== FINAL DLL LIST ==="
          ls -la installer_files/*.dll 2>/dev/null | wc -l
          ls -la installer_files/*.dll 2>/dev/null

      - name: Download Inno Setup
        if: ${{ inputs.create_installer == true }}
        run: |
          curl -L -o innosetup.exe https://jrsoftware.org/download.php/is.exe
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Build Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        shell: msys2 {0}
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss

      - name: Upload Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: eko-setup-${{ inputs.build_type || 'Release' }}
          path: eko-setup.exe
