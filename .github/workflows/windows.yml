name: Windows Build (MinGW-w64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      create_installer:
        description: 'Создать инсталлятор Inno Setup'
        required: false
        default: true
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-portaudio

      - name: Build with MSYS2
        shell: msys2 {0}
        run: |
          export PATH=/ucrt64/bin:$PATH
          mkdir -p build
          cd build
          cmake .. -G "Ninja" \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'Release' }} \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
          ninja

      - name: Deploy Qt
        shell: msys2 {0}
        run: |
          cd build
          windeployqt --release eko.exe

      - name: Prepare installer files
        shell: msys2 {0}
        run: |
          # Создаём папку для установщика
          mkdir -p installer_files

          # Копируем EXE
          cp build/eko.exe installer_files/

          # Копируем DLL, которые уже скопировал windeployqt
          cp build/*.dll installer_files/ 2>/dev/null || true

          # ============ ФИКСИРОВАННЫЙ СПИСОК DLL ============

          # Базовые библиотеки MinGW
          cp /ucrt64/bin/libgcc_s_seh-1.dll installer_files/
          cp /ucrt64/bin/libstdc++-6.dll installer_files/
          cp /ucrt64/bin/libwinpthread-1.dll installer_files/

          # PortAudio (ищем оба варианта имени)
          cp /ucrt64/bin/libportaudio-2.dll installer_files/ 2>/dev/null || true
          cp /ucrt64/bin/libportaudio-2.dll installer_files/libportaudio.dll 2>/dev/null || true

          # libsndfile
          cp /ucrt64/bin/libsndfile-1.dll installer_files/ 2>/dev/null || true
          cp /ucrt64/bin/libsndfile-1.dll installer_files/libsndfile.dll 2>/dev/null || true

          # libsamplerate
          cp /ucrt64/bin/libsamplerate-0.dll installer_files/ 2>/dev/null || true
          cp /ucrt64/bin/libsamplerate-0.dll installer_files/libsamplerate.dll 2>/dev/null || true

          # Дополнительные библиотеки, которые могут понадобиться
          # (добавляйте по мере необходимости)
          cp /ucrt64/bin/libwinmm.dll installer_files/ 2>/dev/null || true
          cp /ucrt64/bin/libws2_32.dll installer_files/ 2>/dev/null || true

          # ===================================================

          # Копируем папки с плагинами Qt
          cp -r build/platforms installer_files/ 2>/dev/null || true
          cp -r build/styles installer_files/ 2>/dev/null || true
          cp -r build/imageformats installer_files/ 2>/dev/null || true
          cp -r build/iconengines installer_files/ 2>/dev/null || true

          # Создаём папки, если их нет
          mkdir -p installer_files/platforms
          mkdir -p installer_files/styles
          mkdir -p installer_files/imageformats
          mkdir -p installer_files/iconengines

          # Выводим список скопированных DLL для проверки
          echo "=== Скопированные DLL ==="
          ls -la installer_files/*.dll 2>/dev/null || echo "Нет DLL"

      - name: Download Inno Setup
        if: ${{ inputs.create_installer == true }}
        run: |
          curl -L -o innosetup.exe https://jrsoftware.org/download.php/is.exe
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Build Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        shell: msys2 {0}
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss

      - name: Upload Inno Setup installer
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: eko-setup-${{ inputs.build_type || 'Release' }}
          path: eko-setup.exe
