name: Build AppImage (Qt6)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (optional)'
        required: false
        type: string
        default: ''
      release:
        description: 'Upload to release (true/false)'
        required: false
        type: boolean
        default: false

  release:
    types: [published]

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install minimal dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libqt6core5compat6-dev \
          libportaudio2 \
          portaudio19-dev \
          libsndfile1-dev \
          libsamplerate0-dev \
          libasound2-dev \
          patchelf \
          desktop-file-utils

    - name: Check Qt6 installation
      run: |
        qmake6 --version || echo "qmake6 not found"
        pkg-config --modversion sndfile
        pkg-config --modversion samplerate
        pkg-config --modversion portaudio-2.0

    - name: Determine version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [ -n "${{ github.event.release.tag_name }}" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        else
          VERSION="$(git describe --tags --always)-manual"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "AppImage version: ${VERSION}"

    - name: Configure and build with Qt6
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -mtune=generic"
        make -j$(nproc)

    - name: Install to AppDir
      run: |
        cd build
        make install DESTDIR=AppDir

        # Проверяем, что бинарник установлен
        if [ ! -f AppDir/usr/bin/eko ]; then
          echo "ERROR: Binary not found in AppDir/usr/bin/"
          ls -la AppDir/usr/bin/ || true
          exit 1
        fi

        # Проверяем зависимости бинарника
        echo "Binary dependencies:"
        ldd AppDir/usr/bin/eko | grep -E "portaudio|sndfile|samplerate|Qt" || true

        # Копируем .desktop файл и иконку
        if [ -f ../desktop/eko.desktop ]; then
          cp ../desktop/eko.desktop AppDir/
        fi

        if [ -f ../icons/eko.png ]; then
          cp ../icons/eko.png AppDir/
        fi

        # Создаем .desktop если его нет
        if [ ! -f AppDir/eko.desktop ]; then
          cat > AppDir/eko.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=EKO
          Comment=Audio editor and mixer
          Exec=eko
          Icon=eko
          Terminal=false
          Categories=Audio;AudioVideoEditing;Mixer;
          MimeType=audio/x-wav;audio/x-mpeg;audio/ogg;audio/flac;
          EOF
        fi

        # Создаем простую иконку, если её нет
        if [ ! -f AppDir/eko.png ]; then
          # Создаем базовую иконку с помощью ImageMagick, если он установлен
          if command -v convert &> /dev/null; then
            convert -size 256x256 xc:blue -fill white -gravity center -font DejaVu-Sans -pointsize 40 -annotate 0 "EKO" AppDir/eko.png || true
          else
            # Если convert нет, создаем пустой файл
            touch AppDir/eko.png
          fi
        fi

        echo "AppDir contents:"
        ls -la AppDir/

    - name: Download linuxdeploy and Qt plugin
      run: |
        wget -q -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        wget -q -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
        chmod +x linuxdeploy*.AppImage

        # Проверяем скачанные файлы
        file linuxdeploy-x86_64.AppImage | grep ELF || echo "Warning: linuxdeploy is not an ELF file"
        file linuxdeploy-plugin-qt-x86_64.AppImage | grep ELF || echo "Warning: qt plugin is not an ELF file"

    - name: Bundle with linuxdeploy (Qt6)
      run: |
        export VERSION="${{ steps.version.outputs.VERSION }}"
        export LDAI_OUTPUT="EKO-${VERSION}-x86_64.AppImage"

        # Настройка для Qt6
        export QMAKE="/usr/lib/qt6/bin/qmake"
        export DEPLOY_QT_PLUGIN=1
        export NO_STRIP=true
        export UNSHARE=1

        export QT_PLUGIN_PATH="/usr/lib/x86_64-linux-gnu/qt6/plugins/"

        echo "Creating AppImage with Qt6, version: ${VERSION}"
        echo "QMAKE: $(which qmake6 || echo 'qmake6 not in PATH')"

        # Запускаем linuxdeploy
        ./linuxdeploy-x86_64.AppImage \
          --appdir build/AppDir \
          --plugin qt \
          --output appimage

        # Переименовываем результат
        if [ -f "EKO-${VERSION}-x86_64.AppImage" ]; then
          echo "✅ AppImage created successfully"
          ls -la "EKO-${VERSION}-x86_64.AppImage"
        else
          # Ищем любой AppImage
          APPIMAGE=$(find . -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            echo "Found AppImage: $APPIMAGE"
            mv "$APPIMAGE" "EKO-${VERSION}-x86_64.AppImage"
            echo "✅ AppImage renamed to EKO-${VERSION}-x86_64.AppImage"
          else
            echo "❌ No AppImage found!"
            echo "Contents of current directory:"
            ls -la .
            exit 1
          fi
        fi

        echo "AppImage size:"
        du -h "EKO-${VERSION}-x86_64.AppImage"

        # Проверяем, что AppImage содержит Qt6
        echo "Checking if AppImage contains Qt6:"
        ./EKO-${VERSION}-x86_64.AppImage --appimage-extract 2>&1 | head -5 || true
        if [ -d squashfs-root ]; then
          find squashfs-root -name "libQt6*" | head -5
          rm -rf squashfs-root
        fi

    - name: Upload AppImage as artifact
      uses: actions/upload-artifact@v4
      with:
        name: EKO-AppImage-Qt6
        path: |
          ./EKO-*.AppImage
          ./EKO-*.AppImage.zsync
        if-no-files-found: error

    - name: Upload to release
      if: |
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./EKO-*.AppImage
          ./EKO-*.AppImage.zsync
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
