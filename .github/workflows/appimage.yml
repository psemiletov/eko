name: Build AppImage (Qt6)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (optional)'
        required: false
        type: string
        default: ''
      release:
        description: 'Upload to release (true/false)'
        required: false
        type: boolean
        default: false

  release:
    types: [published]

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libqt6core5compat6-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxrender-dev \
          libxcb1-dev \
          libx11-xcb-dev \
          libxcb-glx0-dev \
          libxcb-icccm4-dev \
          libxcb-image0-dev \
          libxcb-keysyms1-dev \
          libxcb-randr0-dev \
          libxcb-render-util0-dev \
          libxcb-shape0-dev \
          libxcb-sync-dev \
          libxcb-xfixes0-dev \
          libxcb-xinerama0-dev \
          libxcb-xkb-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libglib2.0-dev \
          libsm-dev \
          libice-dev \
          libportaudio2 \
          portaudio19-dev \
          libsndfile1-dev \
          libsamplerate0-dev \
          libasound2-dev \
          patchelf \
          desktop-file-utils

    - name: Setup Qt6 environment
      run: |
        # Устанавливаем переменные для Qt6
        export Qt6_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6
        echo "Qt6_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6" >> $GITHUB_ENV

        # Проверяем установку Qt6
        qmake6 --version || echo "qmake6 not found"

        # Проверяем, что есть нужные компоненты
        ls -la /usr/lib/x86_64-linux-gnu/cmake/Qt6/ || echo "Qt6 cmake not found"
        ls -la /usr/lib/x86_64-linux-gnu/libQt6Core.so* || echo "Qt6 libraries not found"

        # Устанавливаем CMAKE_PREFIX_PATH
        echo "CMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt6" >> $GITHUB_ENV

    - name: Determine version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [ -n "${{ github.event.release.tag_name }}" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        else
          VERSION="$(git describe --tags --always)-manual"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "AppImage version: ${VERSION}"

    - name: Configure and build with Qt6
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -mtune=generic" \
          -DCMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu/cmake/Qt6"
        make -j$(nproc)

    - name: Install to AppDir
      run: |
        cd build
        make install DESTDIR=AppDir

        # Проверяем, что бинарник установлен
        if [ ! -f AppDir/usr/bin/eko ]; then
          echo "ERROR: Binary not found in AppDir/usr/bin/"
          ls -la AppDir/usr/bin/ || true
          exit 1
        fi

        # Проверяем зависимости
        echo "Binary dependencies:"
        ldd AppDir/usr/bin/eko | grep -E "portaudio|sndfile|samplerate|Qt" || true

        # Копируем .desktop файл и иконку
        if [ -f ../desktop/eko.desktop ]; then
          cp ../desktop/eko.desktop AppDir/
        fi

        if [ -f ../icons/eko.png ]; then
          cp ../icons/eko.png AppDir/
        fi

        # Создаем .desktop если его нет
        if [ ! -f AppDir/eko.desktop ]; then
          cat > AppDir/eko.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=EKO
          Comment=Audio editor and mixer
          Exec=eko
          Icon=eko
          Terminal=false
          Categories=Audio;AudioVideoEditing;Mixer;
          MimeType=audio/x-wav;audio/x-mpeg;audio/ogg;audio/flac;
          EOF
        fi

        echo "AppDir contents:"
        ls -la AppDir/

    - name: Download linuxdeploy and Qt plugin
      run: |
        wget -q -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        wget -q -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
        chmod +x linuxdeploy*.AppImage

    - name: Bundle with linuxdeploy (Qt6)
      run: |
        export VERSION="${{ steps.version.outputs.VERSION }}"
        export LDAI_OUTPUT="EKO-${VERSION}-x86_64.AppImage"

        # Настройка для Qt6
        export QMAKE="/usr/lib/qt6/bin/qmake"
        export DEPLOY_QT_PLUGIN=1
        export NO_STRIP=true
        export UNSHARE=1

        export QT_PLUGIN_PATH="/usr/lib/x86_64-linux-gnu/qt6/plugins/"
        export Qt6_DIR="/usr/lib/x86_64-linux-gnu/cmake/Qt6"

        echo "Creating AppImage with Qt6, version: ${VERSION}"
        echo "QMAKE: $(which qmake6)"

        # Создаем AppRun, если linuxdeploy не создал
        if [ ! -f build/AppDir/AppRun ]; then
          cat > build/AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin/:${HERE}/bin/:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/:${HERE}/usr/lib/x86_64-linux-gnu/:${HERE}/lib/:${HERE}/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/:${HERE}/usr/lib/x86_64-linux-gnu/qt6/plugins/:${LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="${HERE}/usr/lib/x86_64-linux-gnu/qt6/plugins/"
          export QT_QPA_PLATFORM_PLUGIN_PATH="${HERE}/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/"
          exec "${HERE}/usr/bin/eko" "$@"
          EOF
          chmod +x build/AppDir/AppRun
        fi

        # Запускаем linuxdeploy
        ./linuxdeploy-x86_64.AppImage \
          --appdir build/AppDir \
          --plugin qt \
          --output appimage

        # Переименовываем результат
        if [ -f "EKO-${VERSION}-x86_64.AppImage" ]; then
          echo "✅ AppImage created successfully"
          ls -la "EKO-${VERSION}-x86_64.AppImage"
        else
          APPIMAGE=$(find . -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            echo "Found AppImage: $APPIMAGE"
            mv "$APPIMAGE" "EKO-${VERSION}-x86_64.AppImage"
            echo "✅ AppImage renamed"
          else
            echo "❌ No AppImage found!"
            ls -la .
            exit 1
          fi
        fi

        echo "AppImage size:"
        du -h "EKO-${VERSION}-x86_64.AppImage"

    - name: Upload AppImage as artifact
      uses: actions/upload-artifact@v4
      with:
        name: EKO-AppImage-Qt6
        path: |
          ./EKO-*.AppImage
          ./EKO-*.AppImage.zsync
        if-no-files-found: error

    - name: Upload to release
      if: |
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./EKO-*.AppImage
          ./EKO-*.AppImage.zsync
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
